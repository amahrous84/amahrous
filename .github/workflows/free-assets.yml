# Fetches free images (Pollinations FLUX) and free voice (Edge TTS) for the spec
# named in pipeline/free/request.txt, then commits them back. Used because the
# cloud session cannot reach those sites; rendering still happens there.
name: Free assets

on:
  push:
    paths:
      - 'pipeline/free/request.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - name: Fetch images and voice
        run: |
          for spec in $(cat pipeline/free/request.txt); do python pipeline/free_assets.py "$spec"; done
      - name: Save results
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add -A pipeline/free
          git diff --cached --quiet || git commit -m "Free assets fetched"
          git push
