<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Folio PDF Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one-screen app. Top bar, tool strip, then a page rail beside a scrolling desk of pages. */
:root {
  --desk: #e6e8ee;
  --panel: #ffffff;
  --panel-2: #f3f4f8;
  --line: #d7dae3;
  --fg: #1a1e29;
  --muted: #5b6273;
  --accent: #2c4bd4;
  --accent-fg: #ffffff;
  --accent-soft: #e3e8ff;
  --danger: #c0392b;
  --paper-shadow: 0 1px 2px rgba(20, 26, 50, .12), 0 6px 18px rgba(20, 26, 50, .10);
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-brand: "Fraunces", Georgia, "Times New Roman", serif;
  --font-sign: "Caveat", "Segoe Script", "Brush Script MT", cursive;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #14161b; --panel: #1c1f26; --panel-2: #23262f; --line: #333744;
    --fg: #e6e8ee; --muted: #9ba2b3; --accent: #8199ff; --accent-fg: #0c0f1e;
    --accent-soft: #283058; --danger: #ef6b5d;
    --paper-shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #14161b; --panel: #1c1f26; --panel-2: #23262f; --line: #333744;
  --fg: #e6e8ee; --muted: #9ba2b3; --accent: #8199ff; --accent-fg: #0c0f1e;
  --accent-soft: #283058; --danger: #ef6b5d;
  --paper-shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--fg); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.brand { font-family: var(--font-brand); font-style: italic; font-weight: 600; font-size: 22px; letter-spacing: -.01em; line-height: 1; color: var(--accent); }
.doc-name { min-width: 0; flex: 1 1 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.doc-name strong { color: var(--fg); font-weight: 500; }
.doc-name .dirty { color: var(--accent); }
.group { display: flex; align-items: center; gap: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: var(--radius); background: transparent; color: var(--fg); padding: 0; }
.icon-btn:hover:not(:disabled) { background: var(--panel-2); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn svg, .btn svg, .tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
#zoomLabel { min-width: 46px; text-align: center; }
#pageInd { color: var(--muted); min-width: 52px; text-align: center; }
#sidebarToggle { display: none; }

/* Tool strip */
.toolstrip { display: flex; align-items: center; gap: 8px 16px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-width: 0; }
.tools { display: flex; gap: 2px; overflow-x: auto; min-width: 0; max-width: 100%; scrollbar-width: thin; }
.tool { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; padding: 5px 6px 4px; border: 0; border-radius: var(--radius); background: transparent; color: var(--muted); font-size: 11px; letter-spacing: .01em; white-space: nowrap; }
.tool:hover { background: var(--panel-2); color: var(--fg); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tool-sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--line); flex: none; }
.props { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; color: var(--muted); font-size: 12.5px; }
.prop { display: inline-flex; align-items: center; gap: 6px; }
.prop input[type="color"] { width: 28px; height: 28px; padding: 2px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; }
.prop select, .prop input[type="number"] { height: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 0 6px; }
.prop input[type="number"] { width: 62px; font-family: var(--font-mono); font-size: 12.5px; }
.prop input[type="range"] { width: 84px; accent-color: var(--accent); }
.toggle { height: 28px; min-width: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); font-weight: 700; }
.toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.hint { color: var(--muted); font-size: 12.5px; }
.font-note { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.danger-btn { color: var(--danger); }

/* Main area */
.main { display: grid; grid-template-columns: 208px 1fr; min-height: 0; }
#sidebar { background: var(--panel); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
.tab .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.panel-body { overflow-y: auto; min-height: 0; padding: 12px 10px; }
.thumbs { display: grid; gap: 14px; justify-items: center; }
.thumb { position: relative; display: grid; justify-items: center; gap: 6px; padding: 8px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; width: 100%; }
.thumb:hover { background: var(--panel-2); }
.thumb.current { border-color: var(--accent); background: var(--accent-soft); }
.thumb.drop-before::before, .thumb.drop-after::after { content: ""; position: absolute; left: 8px; right: 8px; height: 3px; border-radius: 2px; background: var(--accent); }
.thumb.drop-before::before { top: -9px; }
.thumb.drop-after::after { bottom: -9px; }
.thumb canvas { display: block; background: #fff; box-shadow: var(--paper-shadow); max-width: 100%; }
.thumb-foot { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 4px; }
.thumb-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-left: 2px; }
.thumb-actions { display: flex; gap: 0; opacity: 0; transition: opacity .12s; }
.thumb:hover .thumb-actions, .thumb.current .thumb-actions, .thumb:focus-within .thumb-actions { opacity: 1; }
.thumb-actions .icon-btn { width: 26px; height: 26px; }
.thumb-actions .icon-btn svg { width: 15px; height: 15px; }
@media (hover: none) { .thumb-actions { opacity: 1; } }
.side-foot { padding: 10px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.side-foot .btn { justify-content: center; width: 100%; }

.form-list { display: grid; gap: 12px; }
.form-field { display: grid; gap: 4px; }
.form-field label { font-size: 12px; color: var(--muted); word-break: break-word; }
.form-field input[type="text"], .form-field select { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 0 8px; }
.form-field.check label { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; }
.form-field input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.empty-note { color: var(--muted); font-size: 13px; line-height: 1.5; }

/* Desk */
#viewer { overflow: auto; min-height: 0; min-width: 0; position: relative; }
#pagesHost { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 28px 24px 64px; min-width: max-content; }
.page { position: relative; background: #fff; box-shadow: var(--paper-shadow); flex: none; }
.page > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.page-label { position: absolute; left: 0; bottom: -21px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#viewer.drawing .layer { touch-action: none; }
#viewer.tool-text .layer { cursor: text; }
#viewer.tool-draw .layer { cursor: crosshair; }
#viewer.tool-edittext .layer { cursor: default; }

.item { position: absolute; touch-action: none; }
#viewer.tool-select .item { cursor: move; }
.item svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.item.highlight { mix-blend-mode: multiply; }
.item img { width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; }
.item.text { white-space: pre; line-height: 1.2; outline: none; min-width: 4px; }
.item.text[contenteditable] { cursor: text; outline: 1.5px dashed var(--accent); outline-offset: 3px; background: rgba(255,255,255,.6); }
.item.selected { outline: 1.5px solid var(--accent); outline-offset: 2px; }
.item.text.selected:not([contenteditable]) { outline-style: solid; }
.handle { position: absolute; width: 11px; height: 11px; background: #fff; border: 1.5px solid var(--accent); border-radius: 2px; touch-action: none; z-index: 2; }
.handle.nw { left: -8px; top: -8px; cursor: nwse-resize; }
.handle.ne { right: -8px; top: -8px; cursor: nesw-resize; }
.handle.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
.handle.se { right: -8px; bottom: -8px; cursor: nwse-resize; }
.run { position: absolute; border-radius: 2px; cursor: text; }
.run:hover { background: rgba(44, 75, 212, .12); outline: 1px solid rgba(44, 75, 212, .55); }

/* Drop overlay */
.drop-veil { position: fixed; inset: 0; background: rgba(44, 75, 212, .14); border: 3px dashed var(--accent); display: grid; place-items: center; z-index: 50; pointer-events: none; }
.drop-veil div { background: var(--panel); padding: 14px 20px; border-radius: 10px; box-shadow: var(--paper-shadow); font-weight: 500; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--panel); padding: 10px 16px; border-radius: 8px; box-shadow: var(--paper-shadow); z-index: 60; max-width: calc(100% - 32px); font-size: 13.5px; }
#toast.error { background: var(--danger); color: #fff; }

/* Busy */
#busy { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10, 12, 20, .25); z-index: 55; }
#busy div { background: var(--panel); padding: 14px 22px; border-radius: 10px; box-shadow: var(--paper-shadow); }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 20, .45); display: grid; place-items: center; z-index: 70; padding: 16px; }
.modal { background: var(--panel); border-radius: 12px; box-shadow: var(--paper-shadow); width: min(560px, 100%); display: grid; gap: 14px; padding: 18px; max-height: 100%; overflow: auto; }
.modal h2 { margin: 0; font-size: 17px; font-weight: 600; }
.modal .tabs { padding: 0; }
.sig-pad { width: 100%; aspect-ratio: 3 / 1; max-width: 100%; border: 1px dashed var(--line); border-radius: 8px; background: #fff; touch-action: none; display: block; cursor: crosshair; }
.sig-type { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 10px; background: var(--panel); font-size: 16px; }
.sig-preview { width: 100%; aspect-ratio: 3 / 1; border: 1px dashed var(--line); border-radius: 8px; background: #fff; display: block; }
.modal-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.swatches { display: flex; gap: 6px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; }
  #sidebar { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: min(240px, 80vw); box-shadow: var(--paper-shadow); transform: translateX(-102%); transition: transform .18s; padding-top: env(safe-area-inset-top, 0px); }
  #sidebar.open { transform: none; }
  #sidebarToggle { display: inline-grid; }
  .doc-name { flex-basis: 80px; }
  .btn .label-wide { display: none; }
  #pagesHost { padding: 16px 16px 48px; gap: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="sidebarToggle" title="Pages" aria-label="Show pages"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand" aria-label="Folio">Folio</div>
    <div class="doc-name" id="docName"></div>
    <div class="group">
      <button class="btn" id="openBtn" title="Open a PDF (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open</button>
      <button class="btn" id="mergeBtn" title="Append pages from another PDF"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="label-wide">Add PDF</span></button>
    </div>
    <div class="group">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="group">
      <button class="icon-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></svg></button>
      <span class="mono" id="zoomLabel">100%</span>
      <button class="icon-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg></button>
      <button class="icon-btn" id="zoomFit" title="Fit width" aria-label="Fit width"><svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
    </div>
    <span class="mono" id="pageInd">–</span>
    <button class="btn primary" id="saveBtn" title="Save a copy with your changes (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Save PDF</button>
  </header>

  <div class="toolstrip">
    <div class="tools" id="tools" role="toolbar" aria-label="Tools"></div>
    <div class="props" id="props">
      <span class="hint" id="propHint">Click an item to select it. Drag to move, use the corners to resize.</span>
      <label class="prop" data-for="color" title="Color">Color <input type="color" id="propColor" value="#1a1e29"></label>
      <label class="prop" data-for="fill" title="Fill"><input type="checkbox" id="propFillOn"> Fill <input type="color" id="propFill" value="#ffe08a"></label>
      <label class="prop" data-for="width" title="Line width">Width
        <select id="propWidth"><option>1</option><option>1.5</option><option selected>2</option><option>3</option><option>4</option><option>6</option><option>8</option><option>12</option></select>
      </label>
      <label class="prop" data-for="font" title="Font">
        <select id="propFont"><option value="Helvetica">Helvetica</option><option value="Times">Times</option><option value="Courier">Courier</option></select>
      </label>
      <label class="prop" data-for="font" title="Font size (pt)"><input type="number" id="propSize" min="4" max="200" step="1" value="14"> pt</label>
      <span class="prop" data-for="font"><button class="toggle" id="propBold" aria-pressed="false" title="Bold">B</button><button class="toggle" id="propItalic" aria-pressed="false" title="Italic"><i>I</i></button></span>
      <span class="prop font-note" data-for="fontnote" id="propFontNote"></span>
      <label class="prop" data-for="opacity" title="Opacity">Opacity <input type="range" id="propOpacity" min="10" max="100" value="100"></label>
      <span class="prop" data-for="delete"><button class="btn danger-btn" id="propDelete" title="Delete (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Delete</button></span>
    </div>
  </div>

  <div class="main">
    <aside id="sidebar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabPages" aria-selected="true">Pages<span class="count" id="pageCount"></span></button>
        <button class="tab" role="tab" id="tabForm" aria-selected="false">Form<span class="count" id="formCount"></span></button>
      </div>
      <div class="panel-body" id="pagesPanel"><div class="thumbs" id="thumbs"></div></div>
      <div class="panel-body" id="formPanel" hidden></div>
      <div class="side-foot" id="pagesFoot">
        <button class="btn" id="blankBtn"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 11v6M9 14h6"/></svg>Insert blank page</button>
      </div>
    </aside>
    <section id="viewer" class="tool-select"><div id="pagesHost"></div></section>
  </div>
</div>

<input type="file" id="openInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="mergeInput" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<div class="drop-veil" id="dropVeil" hidden><div id="dropMsg">Drop a PDF to open it</div></div>
<div id="toast" role="status" hidden></div>
<div id="busy" hidden><div id="busyMsg">Working…</div></div>

<div class="modal-back" id="sigModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
    <h2 id="sigTitle">Add a signature</h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="sigTabDraw" aria-selected="true">Draw</button>
      <button class="tab" role="tab" id="sigTabType" aria-selected="false">Type</button>
    </div>
    <div id="sigDrawPane"><canvas class="sig-pad" id="sigPad" width="900" height="300"></canvas></div>
    <div id="sigTypePane" hidden style="display:grid;gap:10px">
      <input class="sig-type" id="sigText" type="text" placeholder="Type your name" autocomplete="name">
      <canvas class="sig-preview" id="sigPreview" width="900" height="300"></canvas>
    </div>
    <div class="modal-row">
      <div class="swatches" role="group" aria-label="Ink color">
        <button class="swatch" data-ink="#111111" style="background:#111111" aria-pressed="true" aria-label="Black ink"></button>
        <button class="swatch" data-ink="#1c3faa" style="background:#1c3faa" aria-pressed="false" aria-label="Blue ink"></button>
      </div>
      <button class="btn" id="sigClear">Clear</button>
    </div>
    <div class="modal-actions">
      <button class="btn" id="sigSaved" hidden>Use last signature</button>
      <button class="btn" id="sigCancel">Cancel</button>
      <button class="btn primary" id="sigUse">Place signature</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

if (!window.pdfjsLib || !window.PDFLib) {
  document.getElementById('docName').textContent = 'The PDF libraries could not load. Check your internet connection and reload.';
  return;
}
// The worker script is loaded above as a plain script, so pdf.js runs it on the main thread.
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PDF_OPTS = { isEvalSupported: false, cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked: true, fontExtraProperties: true };

/* ---------- Icons & tools ---------- */
const ICON = {

async function loadFormFields(bytes) {
